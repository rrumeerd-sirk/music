<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff8f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#201b13" media="(prefers-color-scheme: dark)">
    <title>Snae Player - Local Music Player</title>
    <style>
        /* Tailwind-like CSS variables from Snae Player */
        :root {
            --font-sans: "Heebo", "App CJK Fallback", system-ui, "Noto Color Emoji", sans-serif;
            --spacing: .25rem;
            --radius-lg: .5rem;
            --radius-2xl: 1rem;
            --radius-3xl: 1.5rem;
            --default-transition-duration: .15s;
            --default-transition-timing-function: cubic-bezier(.4,0,.2,1);
            --default-font-family: var(--font-sans);
            --color-primary: #f7bd48;
            --color-onPrimary: #412d00;
            --color-secondary: #dac4a0;
            --color-onSecondary: #3c2e15;
            --color-secondaryContainer: #54452a;
            --color-onSecondaryContainer: #f7dfbb;
            --color-error: #ffb4ab;
            --color-surface: #201b13;
            --color-onSurface: #ece1d4;
            --color-surfaceContainerHighest: #3a342b;
            --color-outlineVariant: #4e4639;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --color-primary: #7c5800;
                --color-onPrimary: #fff;
                --color-secondary: #6d5c3f;
                --color-onSecondary: #fff;
                --color-secondaryContainer: #f7dfbb;
                --color-onSecondaryContainer: #251a04;
                --color-error: #ba1a1a;
                --color-surface: #fff8f3;
                --color-onSurface: #201b13;
                --color-surfaceContainerHighest: #ece1d4;
                --color-outlineVariant: #d1c5b4;
            }
        }

        * {
            box-sizing: border-box;
            border: 0 solid;
            margin: 0;
            padding: 0;
        }

        html, :host {
            -webkit-text-size-adjust: 100%;
            tab-size: 4;
            line-height: 1.5;
            font-family: var(--default-font-family);
            font-feature-settings: normal;
            font-variation-settings: normal;
            -webkit-tap-highlight-color: transparent;
        }

        a { color: inherit; text-decoration: inherit; }
        svg { vertical-align: middle; display: block; }
        button, input { font: inherit; color: inherit; opacity: 1; background-color: transparent; border-radius: 0; border: none; }
        ::placeholder { opacity: 1; }
        ::file-selector-button { font: inherit; margin-inline-end: 4px; }
        [hidden] { display: none !important; }

        /* Scrollbar */
        * { scrollbar-width: thin; scrollbar-color: color-mix(in oklab, var(--color-secondary) 30%, transparent) transparent; }

        :where(:focus-visible) { outline: calc(var(--spacing) * .5) solid var(--color-onSurface); outline-offset: calc(var(--spacing) * .5); }

        /* Utility classes */
        .interactable { appearance: none; cursor: pointer; z-index: 0; border: none; outline-width: 0; text-decoration: none; transition: outline-width .15s linear; position: relative; overflow: hidden; }
        .interactable:after { content: ""; z-index: -1; pointer-events: none; opacity: 0; width: 100%; height: 100%; transition: opacity .2s linear, display .2s allow-discrete; background: currentColor; display: none; position: absolute; top: 0; left: 0; }
        @media (any-hover: hover) { .interactable:hover:after { opacity: .08; display: block; } .interactable[disabled]:after { display: none; } }
        .interactable:focus-visible, .interactable:hover:focus-visible { outline-width: calc(var(--spacing) * .5); }
        .interactable:focus-visible:after { opacity: .12; display: block; }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .grid { display: grid; }
        .hidden { display: none; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: var(--spacing); }
        .gap-2 { gap: calc(var(--spacing) * 2); }
        .gap-2\.5 { gap: calc(var(--spacing) * 2.5); }
        .gap-4 { gap: calc(var(--spacing) * 4); }
        .shrink-0 { flex-shrink: 0; }
        .grow { flex-grow: 1; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-125 { max-width: calc(var(--spacing) * 125); }
        .max-w-225 { max-width: calc(var(--spacing) * 225); }
        .size-1 { width: var(--spacing); height: var(--spacing); }
        .size-6 { width: calc(var(--spacing) * 6); height: calc(var(--spacing) * 6); }
        .size-11 { width: calc(var(--spacing) * 11); height: calc(var(--spacing) * 11); }
        .h-4 { height: calc(var(--spacing) * 4); }
        .h-6 { height: calc(var(--spacing) * 6); }
        .h-10 { height: calc(var(--spacing) * 10); }
        .h-11 { height: calc(var(--spacing) * 11); }
        .h-12 { height: calc(var(--spacing) * 12); }
        .h-14 { height: calc(var(--spacing) * 14); }
        .w-18 { width: calc(var(--spacing) * 18); }
        .w-20 { width: calc(var(--spacing) * 20); }
        .w-60 { width: calc(var(--spacing) * 60); }
        .overflow-hidden { overflow: hidden; }
        .rounded-lg { border-radius: var(--radius-lg); }
        .rounded-2xl { border-radius: var(--radius-2xl); }
        .rounded-3xl { border-radius: var(--radius-3xl); }
        .rounded-full { border-radius: 2147483647px; }
        .border { border-style: solid; border-width: 1px; }
        .border-r { border-right-style: solid; border-right-width: 1px; }
        .border-outlineVariant { border-color: var(--color-outlineVariant); }
        .border-primary\/10 { border-color: color-mix(in oklab, var(--color-primary) 10%, transparent); }
        .bg-onSurface\/12 { background-color: color-mix(in oklab, var(--color-onSurface) 12%, transparent); }
        .bg-onSurface\/38 { background-color: color-mix(in oklab, var(--color-onSurface) 38%, transparent); }
        .bg-primary { background-color: var(--color-primary); }
        .bg-primary\/30 { background-color: color-mix(in oklab, var(--color-primary) 30%, transparent); }
        .bg-secondaryContainer { background-color: var(--color-secondaryContainer); }
        .bg-surfaceContainerHighest { background-color: var(--color-surfaceContainerHighest); }
        .bg-transparent { background-color: transparent; }
        .fill-current { fill: currentColor; }
        .p-2 { padding: calc(var(--spacing) * 2); }
        .p-4 { padding: calc(var(--spacing) * 4); }
        .px-2 { padding-inline: calc(var(--spacing) * 2); }
        .px-4 { padding-inline: calc(var(--spacing) * 4); }
        .px-6 { padding-inline: calc(var(--spacing) * 6); }
        .pr-2 { padding-right: calc(var(--spacing) * 2); }
        .pl-2 { padding-left: calc(var(--spacing) * 2); }
        .pl-20 { padding-left: calc(var(--spacing) * 20); }
        .pt-2 { padding-top: calc(var(--spacing) * 2); }
        .pb-4 { padding-bottom: calc(var(--spacing) * 4); }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-body-md { font-size: calc(var(--spacing) * 3.5); line-height: calc(var(--spacing) * 5); letter-spacing: .25px; font-weight: 400; }
        .text-body-sm { font-size: calc(var(--spacing) * 3); line-height: calc(var(--spacing) * 4); letter-spacing: .4px; font-weight: 400; }
        .text-label-lg { font-size: calc(var(--spacing) * 3.5); line-height: calc(var(--spacing) * 5); letter-spacing: .1px; font-weight: 500; }
        .text-title-lg { font-size: calc(var(--spacing) * 5.5); line-height: calc(var(--spacing) * 7); letter-spacing: 0; font-weight: 500; }
        .text-nowrap { text-wrap: nowrap; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .opacity-0 { opacity: 0; }
        .opacity-54 { opacity: .54; }
        .transition-transform { transition-property: transform, translate, scale, rotate; transition-timing-function: var(--default-transition-timing-function); transition-duration: var(--default-transition-duration); }
        .duration-50 { transition-duration: 50ms; }
        .duration-150 { transition-duration: .15s; }
        .duration-600 { transition-duration: .6s; }
        .select-none { -webkit-user-select: none; user-select: none; }
        .origin-center { transform-origin: 50%; }
        .scale-0 { transform: scale(0); }
        .flip-y { transform: scaleY(-1); }
        .appearance-none { appearance: none; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .sticky { position: sticky; }
        .inset-0 { inset: 0; }
        .inset-x-0 { inset-inline: 0; }
        .top-0 { top: 0; }
        .bottom-1 { bottom: var(--spacing); }
        .left-0 { left: 0; }
        .z-1 { z-index: 1; }
        .z-10 { z-index: 10; }
        .mx-auto { margin-inline: auto; }
        .my-auto { margin-block: auto; }
        .mt-2 { margin-top: calc(var(--spacing) * 2); }
        .mt-4 { margin-top: calc(var(--spacing) * 4); }
        .mt-20 { margin-top: calc(var(--spacing) * 20); }
        .mb-1 { margin-bottom: var(--spacing); }
        .mb-2 { margin-bottom: calc(var(--spacing) * 2); }
        .mb-4 { margin-bottom: calc(var(--spacing) * 4); }
        .ml-auto { margin-left: auto; }
        .w-0 { width: 0; }
        .w-1 { width: var(--spacing); }
        .h-max { height: max-content; }
        .h-min { height: min-content; }
        .w-max { width: max-content; }
        .self-stretch { align-self: stretch; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .contain-strict { contain: strict; }
        .overflow-clip { overflow: clip; }
        .transition-\[outline-width\] { transition-property: outline-width; transition-timing-function: var(--default-transition-timing-function); }
        .transition-\[border-radius\] { transition-property: border-radius; transition-timing-function: var(--default-transition-timing-function); }

        /* Search bar specific */
        @media (width >= 40rem) {
            .sm\:grid { display: grid; }
            .sm\:hidden { display: none; }
            .sm\:h-11 { height: calc(var(--spacing) * 11); }
            .sm\:max-w-45 { max-width: calc(var(--spacing) * 45); }
            .sm\:px-4 { padding-inline: calc(var(--spacing) * 4); }
            .sm\:pt-2 { padding-top: calc(var(--spacing) * 2); }
            .sm\:pb-4 { padding-bottom: calc(var(--spacing) * 4); }
            .sm\:flex { display: flex; }
        }
        @media (width < 40rem) {
            .max-sm\:hidden { display: none; }
            .max-sm\:p-2 { padding: calc(var(--spacing) * 2); }
            .max-sm\:rounded-r-4 { border-radius: 0 0.5rem 0.5rem 0; }
        }

        /* Custom styles for player */
        body {
            background: var(--color-surface);
            color: var(--color-onSurface);
            min-height: 100vh;
            font-family: var(--font-sans);
        }

        .sidebar-link {
            background: var(--color-secondaryContainer);
            color: var(--color-onSecondaryContainer);
        }
        .sidebar-link:not(.active) { background: transparent; color: var(--color-onSurface); }
        .sidebar-link:not(.active):hover { background: color-mix(in oklab, var(--color-onSurface) 8%, transparent); }

        .search-input { background: transparent; color: var(--color-onSurface); }
        .search-input::placeholder { color: color-mix(in oklab, var(--color-onSurface) 54%, transparent); }

        .song-item {
            transition: background .2s;
        }
        .song-item:hover { background: color-mix(in oklab, var(--color-onSurface) 8%, transparent); }
        .song-item.playing { background: color-mix(in oklab, var(--color-primary) 15%, transparent); }
        .song-item.playing .song-title { color: var(--color-primary); }

        .slider input { cursor: pointer; }
        .thumb { transition: transform .1s linear; }

        .play-icon .play-bar { width: 4px; height: 16px; background: currentColor; border-radius: 1px; display: inline-block; margin: 0 1px; }
        .play-icon.paused .play-bar { height: 20px; }
    </style>
</head>
<body>
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <symbol id="system-icon-musicNote" viewBox="0 0 24 24"><path d="M12 3v9.26c-.5-.17-1-.26-1.5-.26C8 12 6 14 6 16.5S8 21 10.5 21s4.5-2 4.5-4.5V6h4V3h-7z"/></symbol>
            <symbol id="system-icon-album" viewBox="0 0 24 24"><path d="M12 3v9.26c-.5-.17-1-.26-1.5-.26C8 12 6 14 6 16.5S8 21 10.5 21s4.5-2 4.5-4.5V6h4V3h-7zm0 2c2.48 0 4.5 2.02 4.5 4.5S14.48 17 12 17s-4.5-2.02-4.5-4.5 2.02-4.5 4.5-4.5z"/></symbol>
            <symbol id="system-icon-person" viewBox="0 0 24 24"><path d="M12 4a4 4 0 014 4 4 4 0 01-4 4 4 4 0 01-4-4 4 4 0 014-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4z"/></symbol>
            <symbol id="system-icon-playlist" viewBox="0 0 24 24"><path d="M15 6H3v2h12V6m0 4H3v2h12v-2M3 16h8v-2H3v2M17 6v8.18c-.31-.11-.65-.18-1-.18a3 3 0 00-3 3 3 3 0 003 3 3 3 0 003-3V8h3V6h-5z"/></symbol>
            <symbol id="system-icon-plus" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></symbol>
            <symbol id="system-icon-sort" viewBox="0 0 24 24"><path d="M3 13h12v-2H3m0-5v2h18V6M3 18h6v-2H3v2z"/></symbol>
            <symbol id="system-icon-sortAscending" viewBox="0 0 24 24"><path d="M19 17H22L18 21L14 17H17V3H19V17M7 3C4.79 3 3 4.79 3 7S4.79 11 7 11 11 9.21 11 7 9.21 3 7 3M7 9C5.9 9 5 8.1 5 7S5.9 5 7 5 9 5.9 9 7 8.1 9 7 9M7 13C4.79 13 3 14.79 3 17S4.79 21 7 21 11 19.21 11 17 9.21 13 7 13Z"/></symbol>
            <symbol id="system-icon-moreVertical" viewBox="0 0 24 24"><path d="M12 16a2 2 0 012 2 2 2 0 01-2 2 2 2 0 01-2-2 2 2 0 012-2m0-6a2 2 0 012 2 2 2 0 01-2 2 2 2 0 01-2-2 2 2 0 012-2m0-6a2 2 0 012 2 2 2 0 01-2 2 2 2 0 01-2-2 2 2 0 012-2z"/></symbol>
            <symbol id="system-icon-shuffle" viewBox="0 0 24 24"><path d="M14.83,13.41L13.42,14.82L16.55,17.95L14.5,20H20V14.5L17.96,16.54L14.83,13.41M14.5,4L16.54,6.04L4,18.59L5.41,20L17.96,7.46L20,9.5V4M10.59,9.17L5.41,4L4,5.41L9.17,10.58L10.59,9.17Z"/></symbol>
            <symbol id="system-icon-chevronUp" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5H7z"/></symbol>
            <symbol id="system-icon-volumeHigh" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></symbol>
            <symbol id="system-icon-volumeMid" viewBox="0 0 24 24"><path d="M5,9V15H9L14,20V4L9,9M18.5,12C18.5,10.23 17.5,8.71 16,7.97V16C17.5,15.29 18.5,13.76 18.5,12Z"/></symbol>
            <symbol id="system-icon-volumeOff" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
            <symbol id="system-icon-chevronDown" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></symbol>
            <symbol id="system-icon-chevronLeft" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
            <symbol id="system-icon-chevronRight" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
            <symbol id="system-icon-skipPrevious" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
            <symbol id="system-icon-skipNext" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
            <symbol id="system-icon-playArrow" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>

    </svg>

    <div id="app">
        <!-- Sidebar -->
        <div class="desktop-sidebar fixed top-0 z-10 mt-20 h-max w-max flex-col items-center gap-2 flex" style="left: var(--safe-area-inset-left, 0); top: calc(var(--spacing) * 8);">
            <a class="interactable flex shrink-0 items-center justify-center h-14 w-20 sidebar-link active rounded-full p-2" id="nav-tracks" href="#" data-page="tracks">
                <div class="flex items-center justify-center rounded-full p-2">
                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-musicNote"></use></svg>
                </div>
            </a>
            <a class="interactable flex shrink-0 items-center justify-center h-14 w-20 sidebar-link rounded-full p-2" id="nav-albums" href="#" data-page="albums">
                <div class="flex items-center justify-center rounded-full p-2">
                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-album"></use></svg>
                </div>
            </a>
            <a class="interactable flex shrink-0 items-center justify-center h-14 w-20 sidebar-link rounded-full p-2" id="nav-artists" href="#" data-page="artists">
                <div class="flex items-center justify-center rounded-full p-2">
                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-person"></use></svg>
                </div>
            </a>
            <a class="interactable flex shrink-0 items-center justify-center h-14 w-20 sidebar-link rounded-full p-2" id="nav-playlists" href="#" data-page="playlists">
                <div class="flex items-center justify-center rounded-full p-2">
                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-playlist"></use></svg>
                </div>
            </a>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col mx-auto w-full max-w-225 grow" style="max-width: calc(var(--spacing) * 225);">
            <div class="flex h-full grow">
                <div class="flex w-full grow flex-col pb-56">
                    <div class="pl-20 flex grow flex-col pt-8">
                        <div class="flex grow flex-col px-4">
                            <!-- Search Bar -->
                            <div class="search-bar sticky top-14 z-10 mt-2 mb-4 ml-auto flex w-full max-w-125 items-center gap-1 rounded-lg border border-primary/10 bg-surfaceContainerHighest px-2" style="top: calc(var(--spacing) * 2 + var(--safe-area-inset-top, 0));">
                                <input type="text" name="search" id="searchInput" class="h-12 w-60 grow search-input pl-2 text-body-md focus:outline-none" placeholder="Search tracks" value="">
                                <div role="separator" aria-orientation="vertical" class="my-auto hidden h-6 sm:flex shrink-0 self-stretch border-outlineVariant w-0 border-r"></div>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="sortBtn" tabindex="0" type="button">
                                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-sort"></use></svg>
                                </button>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full transition-transform" id="sortOrderBtn" tabindex="0" type="button">
                                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-sortAscending"></use></svg>
                                </button>
                                <div role="separator" aria-orientation="vertical" class="my-auto hidden h-6 sm:flex shrink-0 self-stretch border-outlineVariant w-0 border-r"></div>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="moreBtn" tabindex="0" type="button">
                                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-moreVertical"></use></svg>
                                </button>
                            </div>

                            <!-- Track List -->
                            <div class="flex grow flex-col overflow-auto" id="trackListContainer">
                                <div id="trackList" class="flex flex-col gap-1">
                                    <!-- Songs will be inserted here -->
                                </div>
                                <div id="emptyState" class="my-auto flex flex-col items-center text-center hidden">
                                    <div class="mb-1 text-title-lg">Your library is empty</div>
                                    <p class="mb-4" style="color: var(--color-onSurface); opacity: 0.6;">Add audio files to the <code>songs/</code> folder and refresh</p>
                                    <a class="interactable flex h-10 items-center justify-center gap-2 rounded-3xl px-6 text-label-lg transition-[outline-width] duration-150" id="refreshBtn" tabindex="0" type="button" href="#">
                                        <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-plus"></use></svg> Refresh
                                    </a>
                                </div>
                                <div id="loadingState" class="my-auto flex flex-col items-center text-center">
                                    <div class="spinner" style="border: 3px solid var(--color-outlineVariant); border-top: 3px solid var(--color-primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 1rem;"></div>
                                    <p style="color: var(--color-onSurface); opacity: 0.6;">Loading songs...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mini Player (Persistent Footer) -->
        <div class="page-overlay-container pointer-events-none fixed inset-x-0 grid gap-2 overflow-hidden" style="bottom: 0; z-index: 100; padding: calc(var(--spacing) * 4); padding-bottom: calc(var(--safe-area-inset-bottom, 0) + var(--spacing) * 4);">
            <div class="persistent-footer grid gap-2" style="grid-template-columns: 1fr;">
                <div id="mini-player" class="pointer-events-auto mx-auto w-full max-w-225 justify-between overflow-hidden rounded-2xl border border-primary/10 bg-secondaryContainer text-onSecondaryContainer contain-content">
                    <div class="flex size-full flex-col items-center justify-between gap-4 px-4 pt-2 pb-4">
                        <!-- Timeline -->
                        <div class="timeline-container grid w-full items-center gap-2.5 text-nowrap tabular-nums">
                            <div class="text-body-sm" id="currentTime">0:00</div>
                            <div class="slider relative flex overflow-hidden select-none w-full">
                                <input type="range" disabled min="0" max="1000" class="grow appearance-none opacity-0 disabled:cursor-auto horizontal-input h-11 w-full" id="progressSlider" value="0">
                                <div class="pointer-events-none absolute top-0 left-0 mr-2 h-full" style="width: 4px;">
                                    <div class="thumb rounded-lg transition-transform h-full w-1 bg-onSurface/38" id="progressThumb" style="transform: translateX(calc(0% - 2px));"></div>
                                </div>
                                <div class="pointer-events-none absolute inset-0 self-end overflow-clip transition-[border-radius] duration-50 contain-strict my-auto h-4" style="width: 4px; border-radius: 2px 8px 8px 2px;">
                                    <div class="absolute rounded-r-0.5 inset-y-0 -left-full my-auto h-4 w-full bg-onSurface/38" id="progressFilled" style="transform: translateX(calc(0% - 6px));"></div>
                                    <div class="absolute size-full rounded-l-0.5 top-0 left-0 bg-onSurface/12" style="transform: translateX(calc(0% + 10px));"></div>
                                </div>
                            </div>
                            <div class="text-right text-body-sm" id="totalTime">0:00</div>
                        </div>

                        <!-- Controls -->
                        <div class="flex h-min w-full grow grid-cols-[1fr_max-content_1fr] items-center">
                            <!-- Track Info -->
                            <div class="flex grow items-center min-w-0">
                                <a class="interactable group flex grow items-center rounded-lg pr-2 max-sm:p-2 sm:h-11 sm:max-w-45" id="trackLink" tabindex="0" type="button" href="#">
                                    <div class="relative -z-1 size-11 shrink-0 overflow-hidden rounded-lg bg-onSurface/12">
                                        <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current absolute inset-0 m-auto" style="opacity: 0.4;"><use href="#system-icon-musicNote"></use></svg>
                                    </div>
                                </a>
                                <div class="pl-2 min-w-0" id="trackInfo">
                                    <div class="text-body-md text-nowrap overflow-hidden text-ellipsis" id="miniTitle">No track playing</div>
                                    <div class="text-body-sm text-nowrap overflow-hidden text-ellipsis" style="color: var(--color-onSecondaryContainer); opacity: 0.7;" id="miniArtist">Select a song</div>
                                </div>
                            </div>

                            <!-- Mobile controls (hidden on desktop) -->
                            <div class="ml-auto flex gap-2 pr-2 sm:hidden">
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="mobileShuffle" tabindex="0" type="button">
                                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-shuffle"></use></svg>
                                </button>
                            </div>

                            <!-- Main Controls -->
                            <div class="flex items-center gap-2 max-sm:hidden">
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="shuffleBtn" tabindex="0" type="button">
                                    <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current"><use href="#system-icon-shuffle"></use></svg>
                                    <div class="absolute bottom-1 size-1 origin-center rounded-full bg-primary transition-transform duration-600 scale-0" id="shuffleActive"></div>
                                </button>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full opacity-54" id="prevBtn" tabindex="0" type="button" disabled>
                                    <svg class="size-6 fill-current" viewBox="0 0 24 24"><use href="#system-icon-skipPrevious"></use></svg>
                                </button>
                                <button class="interactable flex h-10 items-center justify-center gap-2 rounded-3xl px-6 text-label-lg transition-[outline-width] duration-150 w-18 p-0 bg-primary text-onPrimary" id="playPauseBtn" tabindex="0" type="button" disabled>
                                    <div class="play-icon relative z-1 size-6 paused" id="playIcon">
                                        <div class="play-bar"></div>
                                        <div class="play-bar flip-y"></div>
                                    </div>
                                </button>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full opacity-54" id="nextBtn" tabindex="0" type="button" disabled>
                                    <svg class="size-6 fill-current" viewBox="0 0 24 24"><use href="#system-icon-skipNext"></use></svg>
                                </button>
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="repeatBtn" tabindex="0" type="button">
                                    <svg class="size-6 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" class="origin-center"/><path d="M 13,15 V 9.0000002 H 12 L 10,10 v 1 h 1.5 v 4 z" class="origin-center transition-transform scale-0"></path></svg>
                                    <div class="absolute bottom-1 size-1 origin-center rounded-full bg-primary transition-transform duration-600 scale-0" id="repeatActive"></div>
                                </button>
                            </div>

                            <!-- Volume -->
                            <div class="ml-auto flex items-center gap-2 pr-2 max-sm:hidden">
                                <button class="interactable flex size-11 shrink-0 items-center justify-center rounded-full" id="volumeBtn" tabindex="0" type="button">
                                    <svg class="size-6 fill-current" id="volumeIcon" viewBox="0 0 24 24"><use href="#system-icon-volumeHigh"></use></svg>
                                </button>
                                <div class="slider relative flex overflow-hidden select-none w-full" style="width: 100px;">
                                    <input type="range" min="0" max="100" class="grow appearance-none opacity-0 disabled:cursor-auto horizontal-input h-11 w-full" id="volumeSlider" value="70">
                                    <div class="pointer-events-none absolute top-0 left-0 mr-2 h-full" style="width: 4px;">
                                        <div class="thumb rounded-lg transition-transform h-full w-1 bg-primary" id="volumeThumb" style="transform: translateX(calc(70% - 2px));"></div>
                                    </div>
                                    <div class="pointer-events-none absolute inset-0 self-end overflow-clip transition-[border-radius] duration-50 contain-strict my-auto h-4" style="width: 4px; border-radius: 8px 2px 2px 8px;">
                                        <div class="absolute rounded-r-0.5 inset-y-0 -left-full my-auto h-4 w-full bg-primary" id="volumeFilled" style="transform: translateX(calc(70% - 6px));"></div>
                                        <div class="absolute size-full rounded-l-0.5 top-0 left-0 bg-primary/30" style="transform: translateX(calc(70% + 10px));"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .horizontal-input { -webkit-appearance: none; appearance: none; background: transparent; }
        .horizontal-input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 0; height: 0; }
        .horizontal-input::-moz-range-thumb { width: 0; height: 0; border: none; }
    </style>

    <script>
        // ==================== STATE ====================
        const audio = new Audio();
        let songs = [];
        let currentIndex = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0=off, 1=all, 2=one
        let sortOrder = 'asc'; // 'asc' or 'desc'
        let sortBy = 'title'; // 'title', 'artist', 'duration'

        // ==================== DOM ELEMENTS ====================
        const elements = {
            trackList: document.getElementById('trackList'),
            emptyState: document.getElementById('emptyState'),
            loadingState: document.getElementById('loadingState'),
            searchInput: document.getElementById('searchInput'),
            sortBtn: document.getElementById('sortBtn'),
            sortOrderBtn: document.getElementById('sortOrderBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            miniTitle: document.getElementById('miniTitle'),
            miniArtist: document.getElementById('miniArtist'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            playIcon: document.getElementById('playIcon'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            shuffleBtn: document.getElementById('shuffleBtn'),
            shuffleActive: document.getElementById('shuffleActive'),
            repeatBtn: document.getElementById('repeatBtn'),
            repeatActive: document.getElementById('repeatActive'),
            progressSlider: document.getElementById('progressSlider'),
            progressThumb: document.getElementById('progressThumb'),
            progressFilled: document.getElementById('progressFilled'),
            currentTime: document.getElementById('currentTime'),
            totalTime: document.getElementById('totalTime'),
            volumeSlider: document.getElementById('volumeSlider'),
            volumeThumb: document.getElementById('volumeThumb'),
            volumeFilled: document.getElementById('volumeFilled'),
            volumeIcon: document.getElementById('volumeIcon'),
            volumeBtn: document.getElementById('volumeBtn'),
            trackLink: document.getElementById('trackLink'),
            trackInfo: document.getElementById('trackInfo'),
            mobileShuffle: document.getElementById('mobileShuffle'),
            navTracks: document.getElementById('nav-tracks'),
            navAlbums: document.getElementById('nav-albums'),
            navArtists: document.getElementById('nav-artists'),
            navPlaylists: document.getElementById('nav-playlists'),
        };

        // ==================== UTILITIES ====================
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function parseTitle(filename) {
            // Remove extension and try to parse "Artist - Title" or just use filename
            const name = filename.replace(/\.[^/.]+$/, '');
            const parts = name.split(' - ');
            if (parts.length >= 2) {
                return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
            }
            return { artist: 'Unknown Artist', title: name };
        }

        function updateVolumeIcon() {
            const vol = audio.muted ? 0 : audio.volume;
            if (vol === 0) {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeOff"></use>';
            } else if (vol < 0.5) {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeMid"></use>';
            } else {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeHigh"></use>';
            }
        }

        // ==================== SONG LOADING ====================
        async function loadSongs() {
            elements.loadingState.classList.remove('hidden');
            elements.trackList.classList.add('hidden');
            elements.emptyState.classList.add('hidden');

            try {
                const response = await fetch('/api/songs');
                if (response.ok) {
                    const data = await response.json();
                    songs = data.map(song => {
                        const parsed = parseTitle(song.name);
                        return {
                            ...song,
                            title: parsed.title,
                            artist: parsed.artist
                        };
                    });
                } else {
                    songs = [];
                }
            } catch (e) {
                console.error('Failed to load songs:', e);
                songs = [];
            }

            renderTrackList();
            updateEmptyState();
        }

        function renderTrackList() {
            const searchTerm = elements.searchInput.value.toLowerCase();
            let filtered = songs.filter(song =>
                song.title.toLowerCase().includes(searchTerm) ||
                song.artist.toLowerCase().includes(searchTerm)
            );

            // Sort
            filtered.sort((a, b) => {
                let aVal = a[sortBy] || '';
                let bVal = b[sortBy] || '';
                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }
                if (aVal < bVal) return sortOrder === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            if (filtered.length === 0) {
                elements.trackList.innerHTML = '';
                return;
            }

            elements.trackList.innerHTML = filtered.map((song, displayIndex) => {
                const originalIndex = songs.indexOf(song);
                const isPlaying = originalIndex === currentIndex && !audio.paused;
                return `
                    <div class="song-item flex items-center gap-2 p-2 rounded-lg" data-index="${originalIndex}" style="cursor: pointer;">
                        <div class="size-11 shrink-0 overflow-hidden rounded-lg bg-onSurface/12 flex items-center justify-center">
                            <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current" style="opacity: 0.4;"><use href="#system-icon-musicNote"></use></svg>
                        </div>
                        <div class="grow min-w-0">
                            <div class="text-body-md text-nowrap overflow-hidden text-ellipsis song-title">${escapeHtml(song.title)}</div>
                            <div class="text-body-sm text-nowrap overflow-hidden text-ellipsis" style="color: var(--color-onSurface); opacity: 0.7;">${escapeHtml(song.artist)}</div>
                        </div>
                        <div class="text-body-sm shrink-0" style="color: var(--color-onSurface); opacity: 0.5;" id="duration-${originalIndex}">--:--</div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.song-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    playSong(index);
                });
            });

            // Preload durations
            songs.forEach((song, index) => {
                if (!document.getElementById(`duration-${index}`)) return;
                const tempAudio = new Audio(song.url);
                tempAudio.addEventListener('loadedmetadata', () => {
                    const el = document.getElementById(`duration-${index}`);
                    if (el) el.textContent = formatTime(tempAudio.duration);
                });
            });

            // Highlight current playing
            updatePlayingHighlight();
        }

        function updateEmptyState() {
            if (songs.length === 0) {
                elements.loadingState.classList.add('hidden');
                elements.trackList.classList.add('hidden');
                elements.emptyState.classList.remove('hidden');
            } else {
                elements.loadingState.classList.add('hidden');
                elements.trackList.classList.remove('hidden');
                elements.emptyState.classList.add('hidden');
            }
        }

        function updatePlayingHighlight() {
            document.querySelectorAll('.song-item').forEach(item => {
                const index = parseInt(item.dataset.index);
                const isCurrent = index === currentIndex;
                const isPlayingNow = isCurrent && !audio.paused;
                item.classList.toggle('playing', isPlayingNow);
            });
        }

        // ==================== PLAYBACK ====================
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;

            currentIndex = index;
            const song = songs[index];

            audio.src = song.url;
            audio.load();
            audio.play().catch(e => console.error('Playback failed:', e));

            updateUI();
            updatePlayingHighlight();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayButton();
        }

        function playPrev() {
            if (isShuffle) {
                playSong(Math.floor(Math.random() * songs.length));
            } else if (currentIndex > 0) {
                playSong(currentIndex - 1);
            }
        }

        function playNext() {
            if (isShuffle) {
                playSong(Math.floor(Math.random() * songs.length));
            } else if (currentIndex < songs.length - 1) {
                playSong(currentIndex + 1);
            } else if (repeatMode === 1) {
                playSong(0);
            }
        }

        function updateUI() {
            if (currentIndex >= 0) {
                const song = songs[currentIndex];
                elements.miniTitle.textContent = song.title;
                elements.miniArtist.textContent = song.artist;
                elements.playPauseBtn.disabled = false;
                elements.prevBtn.disabled = currentIndex === 0 && !isShuffle;
                elements.nextBtn.disabled = currentIndex === songs.length - 1 && !isShuffle;
                elements.prevBtn.style.opacity = (currentIndex === 0 && !isShuffle) ? '0.54' : '1';
                elements.nextBtn.style.opacity = (currentIndex === songs.length - 1 && !isShuffle) ? '0.54' : '1';
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            const isPlaying = !audio.paused;
            elements.playIcon.classList.toggle('paused', audio.paused);
            elements.playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
        }

        // ==================== EVENT LISTENERS ====================
        elements.playPauseBtn.addEventListener('click', togglePlay);
        elements.prevBtn.addEventListener('click', playPrev);
        elements.nextBtn.addEventListener('click', playNext);

        elements.shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            elements.shuffleActive.classList.toggle('scale-0', !isShuffle);
            elements.shuffleActive.classList.toggle('opacity-0', !isShuffle);
            elements.mobileShuffle.classList.toggle('opacity-54', !isShuffle);
        });

        elements.repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            elements.repeatActive.classList.toggle('scale-0', repeatMode === 0);
            elements.repeatActive.classList.toggle('opacity-0', repeatMode === 0);
            // Change icon for repeat one
            if (repeatMode === 2) {
                elements.repeatBtn.querySelector('svg').innerHTML = '<use href="#system-icon-repeatOne"></use>';
            } else {
                elements.repeatBtn.querySelector('svg').innerHTML = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" class="origin-center"/><path d="M 13,15 V 9.0000002 H 12 L 10,10 v 1 h 1.5 v 4 z" class="origin-center transition-transform scale-0"></path>';
            }
        });

        elements.sortBtn.addEventListener('click', () => {
            // Cycle through sort options
            const options = ['title', 'artist', 'duration'];
            const current = options.indexOf(sortBy);
            sortBy = options[(current + 1) % options.length];
            renderTrackList();
        });

        elements.sortOrderBtn.addEventListener('click', () => {
            sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            elements.sortOrderBtn.querySelector('svg').style.transform = sortOrder === 'desc' ? 'rotate(180deg)' : 'rotate(0deg)';
            renderTrackList();
        });

        elements.searchInput.addEventListener('input', () => {
            renderTrackList();
        });

        elements.refreshBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loadSongs();
        });

        // Progress bar
        elements.progressSlider.addEventListener('input', (e) => {
            const percent = e.target.value / 1000;
            const rect = elements.progressSlider.getBoundingClientRect();
            // Update visual
            elements.progressThumb.style.transform = `translateX(calc(${percent * 100}% - 2px))`;
            elements.progressFilled.style.transform = `translateX(calc(${percent * 100}% - 6px))`;
        });

        elements.progressSlider.addEventListener('change', (e) => {
            const percent = e.target.value / 1000;
            audio.currentTime = percent * audio.duration;
        });

        // Volume
        elements.volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            audio.volume = vol;
            const percent = vol * 100;
            elements.volumeThumb.style.transform = `translateX(calc(${percent}% - 2px))`;
            elements.volumeFilled.style.transform = `translateX(calc(${percent}% - 6px))`;
            updateVolumeIcon();
        });

        elements.volumeBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            updateVolumeIcon();
            elements.volumeSlider.disabled = audio.muted;
        });

        // Audio events
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 1000;
                elements.progressSlider.value = percent;
                elements.progressThumb.style.transform = `translateX(calc(${percent / 10}% - 2px))`;
                elements.progressFilled.style.transform = `translateX(calc(${percent / 10}% - 6px))`;
                elements.currentTime.textContent = formatTime(audio.currentTime);
                elements.totalTime.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            elements.totalTime.textContent = formatTime(audio.duration);
            elements.progressSlider.disabled = false;
        });

        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        });

        audio.addEventListener('play', () => { updatePlayButton(); updatePlayingHighlight(); });
        audio.addEventListener('pause', () => { updatePlayButton(); updatePlayingHighlight(); });
        audio.addEventListener('error', (e) => {
            console.error('Audio error:', e);
            elements.miniTitle.textContent = 'Error loading track';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 10); break;
                case 'ArrowRight': e.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); break;
                case 'ArrowUp': e.preventDefault(); audio.volume = Math.min(1, audio.volume + 0.1); elements.volumeSlider.value = audio.volume * 100; elements.volumeSlider.dispatchEvent(new Event('input')); break;
                case 'ArrowDown': e.preventDefault(); audio.volume = Math.max(0, audio.volume - 0.1); elements.volumeSlider.value = audio.volume * 100; elements.volumeSlider.dispatchEvent(new Event('input')); break;
                case 'KeyM': audio.muted = !audio.muted; updateVolumeIcon(); elements.volumeSlider.disabled = audio.muted; break;
            }
        });

        // Navigation tabs
        document.querySelectorAll('[data-page]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Initialize
        audio.volume = 0.7;
        elements.volumeSlider.value = 70;
        loadSongs();
    </script>
</body>
</html>
