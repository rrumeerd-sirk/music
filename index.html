        <!-- Config Modal -->
        <div id="configModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="configTitle">

                    Enter your GitHub repository info to load songs from <code>songs/</code> folder.

                <input type="text" id="configRepo" placeholder="e.g., music-player" autocomplete="off">

                <input type="text" id="configBranch" placeholder="main" autocomplete="off" value="main">

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
        // ==================== CONFIGURATION ====================
        // Load saved config from localStorage
        function loadConfig() {
            const saved = localStorage.getItem('snae-player-config');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {}
            }
            return { owner: '', repo: '', branch: 'main' };
        }

        function saveConfig(config) {
            localStorage.setItem('snae-player-config', JSON.stringify(config));
        }

        let CONFIG = loadConfig();
        let GITHUB_OWNER = CONFIG.owner;
        let GITHUB_REPO = CONFIG.repo;
        let GITHUB_BRANCH = CONFIG.branch || 'main';

        // ==================== STATE ====================
        const audio = new Audio();
        let allSongs = [];
        let currentQueue = [];
        let currentQueueIndex = -1;
        let currentIndex = -1;
        let isShuffle = false;
        let repeatMode = 0;
        let currentBrowsePath = '';
        let fileTree = [];

        // ==================== DOM ELEMENTS ====================
        const elements = {
            trackList: document.getElementById('trackList'),
            emptyState: document.getElementById('emptyState'),
            loadingState: document.getElementById('loadingState'),
            breadcrumb: document.getElementById('breadcrumb'),
            refreshBtn: document.getElementById('refreshBtn'),
            miniTitle: document.getElementById('miniTitle'),
            miniArtist: document.getElementById('miniArtist'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            playIcon: document.getElementById('playIcon'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            shuffleBtn: document.getElementById('shuffleBtn'),
            shuffleActive: document.getElementById('shuffleActive'),
            repeatBtn: document.getElementById('repeatBtn'),
            repeatActive: document.getElementById('repeatActive'),
            progressSlider: document.getElementById('progressSlider'),
            progressFilled: document.getElementById('progressFilled'),
            currentTime: document.getElementById('currentTime'),
            totalTime: document.getElementById('totalTime'),
            volumeSlider: document.getElementById('volumeSlider'),
            volumeFilled: document.getElementById('volumeFilled'),
            volumeIcon: document.getElementById('volumeIcon'),
            volumeBtn: document.getElementById('volumeBtn'),
            trackLink: document.getElementById('trackLink'),
            trackInfo: document.getElementById('trackInfo'),
            configBtn: document.getElementById('configBtn'),
            configModal: document.getElementById('configModal'),
            configOwner: document.getElementById('configOwner'),
            configRepo: document.getElementById('configRepo'),
            configBranch: document.getElementById('configBranch'),
            configSave: document.getElementById('configSave'),
            configCancel: document.getElementById('configCancel'),
        };

        // ==================== UTILITIES ====================
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function parseTitle(filename) {
            const name = filename.replace(/\.[^/.]+$/, '');
            const parts = name.split(' - ');
            if (parts.length >= 2) {
                return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
            }
            return { artist: 'Unknown Artist', title: name };
        }

        function updateVolumeIcon() {
            const vol = audio.muted ? 0 : audio.volume;
            if (vol === 0) {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeOff"></use>';
            } else if (vol < 0.5) {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeMid"></use>';
            } else {
                elements.volumeIcon.innerHTML = '<use href="#system-icon-volumeHigh"></use>';
            }
        }

        function updateProgressUI(percent) {
            const pct = Math.max(0, Math.min(100, percent * 100));
            elements.progressFilled.style.width = pct + '%';
            elements.progressSlider.value = percent * 1000;
        }

        function updateVolumeUI(vol) {
            const pct = Math.max(0, Math.min(100, vol * 100));
            elements.volumeFilled.style.width = pct + '%';
            elements.volumeSlider.value = vol * 100;
        }

        function closeConfigModal() {
            elements.configModal.classList.add('hidden');
        }

        // ==================== CONFIG MODAL ====================
        elements.configBtn.addEventListener('click', () => {
            elements.configOwner.value = GITHUB_OWNER;
            elements.configRepo.value = GITHUB_REPO;
            elements.configBranch.value = GITHUB_BRANCH;
            elements.configModal.classList.remove('hidden');
        });

        elements.configCancel.addEventListener('click', closeConfigModal);

        elements.configSave.addEventListener('click', () => {
            const owner = elements.configOwner.value.trim();
            const repo = elements.configRepo.value.trim();
            const branch = elements.configBranch.value.trim() || 'main';
            
            if (!owner || !repo) {
                alert('Please enter both owner and repository name');
                return;
            }
            
            GITHUB_OWNER = owner;
            GITHUB_REPO = repo;
            GITHUB_BRANCH = branch;
            
            saveConfig({ owner, repo, branch });
            closeConfigModal();
            loadSongs();
        });

        // Close modal on overlay click
        elements.configModal.addEventListener('click', (e) => {
            if (e.target === elements.configModal) {
                closeConfigModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !elements.configModal.classList.contains('hidden')) {
                closeConfigModal();
            }
        });

        // ==================== GITHUB API ====================
        async function fetchGitHubFileTree() {
            if (!GITHUB_OWNER || !GITHUB_REPO) {
                throw new Error('GitHub repo not configured. Click the settings button to configure.');
            }
            
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
            
            const response = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            
            if (!response.ok) {
                if (response.status === 403) {
                    throw new Error('GitHub API rate limited. Try again later or use a manifest file.');
                }
                if (response.status === 404) {
                    throw new Error('Repository not found. Check owner/repo name.');
                }
                throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            return data.tree || [];
        }

        function processFileTree(tree) {
            const AUDIO_EXTS = ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac'];
            const songs = [];
            
            for (const item of tree) {
                if (item.type === 'blob') {
                    const path = item.path;
                    const ext = path.toLowerCase().substring(path.lastIndexOf('.'));
                    if (AUDIO_EXTS.includes(ext) && path.startsWith('songs/')) {
                        const parsed = parseTitle(path.split('/').pop());
                        songs.push({
                            path: path,
                            name: path.split('/').pop(),
                            url: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`,
                            title: parsed.title,
                            artist: parsed.artist
                        });
                    }
                }
            }
            
            return songs;
        }

        // ==================== LOCAL SERVER FALLBACK ====================
        async function fetchLocalSongs() {
            // Try local API first (for local dev with server.py)
            try {
                const response = await fetch('/api/songs');
                if (response.ok) {
                    const data = await response.json();
                    return data.map(song => ({
                        ...song,
                        path: song.url.replace('/songs/', 'songs/'),
                        url: song.url
                    }));
                }
            } catch (e) {
                // Ignore, will try other methods
            }
            
            // Try GitHub API if configured
            if (GITHUB_OWNER && GITHUB_REPO) {
                try {
                    const tree = await fetchGitHubFileTree();
                    return processFileTree(tree);
                } catch (e) {
                    console.error('GitHub API failed:', e);
                    // Don't throw, try manifest
                }
            }
            
            // Try fetching manifest file
            try {
                const response = await fetch('/songs-manifest.json');
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                // Ignore
            }
            
            return [];
        }

        // ==================== BROWSING ====================
        function buildFolderStructure(songs) {
            const root = { name: '', path: '', folders: {}, files: [] };
            
            for (const song of songs) {
                const relPath = song.path.replace('songs/', '');
                const parts = relPath.split('/');
                let current = root;
                
                for (let i = 0; i < parts.length - 1; i++) {
                    const folderName = parts[i];
                    const folderPath = parts.slice(0, i + 1).join('/');
                    if (!current.folders[folderName]) {
                        current.folders[folderName] = { name: folderName, path: folderPath, folders: {}, files: [] };
                    }
                    current = current.folders[folderName];
                }
                
                current.files.push(song);
            }
            
            return root;
        }

        function getFolderNode(path) {
            if (!path) return fileTree;
            const parts = path.split('/').filter(p => p);
            let current = fileTree;
            for (const part of parts) {
                if (current.folders && current.folders[part]) {
                    current = current.folders[part];
                } else {
                    return null;
                }
            }
            return current;
        }

        function getParentPath(path) {
            if (!path) return '';
            const parts = path.split('/').filter(p => p);
            if (parts.length <= 1) return '';
            return parts.slice(0, -1).join('/');
        }

        function renderBrowseView(path = '') {
            currentBrowsePath = path;
            const folder = getFolderNode(path);
            
            if (!folder) {
                elements.loadingState.classList.add('hidden');
                elements.emptyState.classList.remove('hidden');
                return;
            }
            
            elements.loadingState.classList.add('hidden');
            
            const items = [];
            
            // Add folders first
            if (folder.folders) {
                for (const [name, folderData] of Object.entries(folder.folders)) {
                    items.push({
                        type: 'folder',
                        name: name,
                        path: folderData.path
                    });
                }
            }
            
            // Add files
            if (folder.files) {
                for (const file of folder.files) {
                    items.push({
                        type: 'file',
                        name: file.name,
                        path: file.path,
                        url: file.url,
                        title: file.title,
                        artist: file.artist
                    });
                }
            }
            
            if (items.length === 0) {
                elements.trackList.innerHTML = '';
                elements.trackList.classList.add('hidden');
                elements.emptyState.classList.remove('hidden');
                return;
            }
            
            elements.emptyState.classList.add('hidden');
            elements.trackList.classList.remove('hidden');
            
            elements.trackList.innerHTML = items.map(item => {
                const isPlaying = item.type === 'file' && item.path === getCurrentPlayingPath();
                const icon = item.type === 'folder' 
                    ? '<use href="#system-icon-folder"></use>' 
                    : '<use href="#system-icon-musicNote"></use>';
                const iconColor = item.type === 'folder' ? 'var(--color-primary)' : 'var(--color-onSurface)';
                const iconOpacity = item.type === 'folder' ? '1' : '0.4';

                if (item.type === 'folder') {
                    return `
                        <div class="browse-item flex items-center gap-2 p-2 rounded-lg" data-type="folder" data-path="${escapeHtml(item.path)}" style="cursor: pointer;">
                            <div class="size-11 shrink-0 overflow-hidden rounded-lg bg-onSurface/12 flex items-center justify-center">
                                <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0" style="color: ${iconColor}; opacity: ${iconOpacity};"><${icon}></svg>
                            </div>
                            <div class="grow min-w-0">
                                <div class="text-body-md text-nowrap overflow-hidden text-ellipsis item-title">${escapeHtml(item.name)}</div>
                                <div class="text-body-sm text-nowrap overflow-hidden text-ellipsis" style="color: var(--color-onSurface); opacity: 0.5;">Folder</div>
                            </div>
                            <svg class="size-6 shrink-0" style="color: var(--color-onSurface); opacity: 0.3;" viewBox="0 0 24 24"><use href="#system-icon-chevronRight"></use></svg>
                        </div>
                    `;
                } else {
                    return `
                        <div class="browse-item flex items-center gap-2 p-2 rounded-lg ${isPlaying ? 'playing' : ''}" data-type="file" data-path="${escapeHtml(item.path)}" data-url="${escapeHtml(item.url)}" data-title="${escapeHtml(item.title)}" data-artist="${escapeHtml(item.artist)}" style="cursor: pointer;">
                            <div class="size-11 shrink-0 overflow-hidden rounded-lg bg-onSurface/12 flex items-center justify-center">
                                <svg role="presentation" width="24" height="24" viewBox="0 0 24 24" class="pointer-events-none shrink-0 fill-current" style="opacity: 0.4;"><use href="#system-icon-musicNote"></use></svg>
                            </div>
                            <div class="grow min-w-0">
                                <div class="text-body-md text-nowrap overflow-hidden text-ellipsis item-title">${escapeHtml(item.title)}</div>
                                <div class="text-body-sm text-nowrap overflow-hidden text-ellipsis" style="color: var(--color-onSurface); opacity: 0.7;">${escapeHtml(item.artist)}</div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            document.querySelectorAll('.browse-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (item.dataset.type === 'folder') {
                        renderBrowseView(item.dataset.path);
                        updateBreadcrumb(item.dataset.path);
                    } else {
                        playFromBrowse(item.dataset.path, item.dataset.url, item.dataset.title, item.dataset.artist);
                    }
                });
            });
            
            updateBreadcrumb(path);
        }

        function updateBreadcrumb(currentPath) {
            let html = '';
            
            // Back button (only show if not at root)
            if (currentPath) {
                const parentPath = getParentPath(currentPath);
                html += `<button class="back-btn interactable" data-path="${escapeHtml(parentPath)}" aria-label="Go back" title="Go back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><use href="#system-icon-arrowBack"></use></svg>
                </button>`;
            }
            
            // Current path segments
            if (currentPath) {
                const parts = currentPath.split('/').filter(p => p);
                let accum = '';
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    accum += (accum ? '/' : '') + part;
                    if (i > 0) html += `<span>›</span>`;
                    html += `<a href="#" data-path="${escapeHtml(accum)}">${escapeHtml(part)}</a>`;
                }
            } else {
                html += `<span style="color: var(--color-onSurface); opacity: 0.5;">Library</span>`;
            }
            
            elements.breadcrumb.innerHTML = html;

            elements.breadcrumb.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    renderBrowseView(link.dataset.path);
                });
            });
            
            const backBtn = elements.breadcrumb.querySelector('.back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    renderBrowseView(backBtn.dataset.path);
                });
            }
        }

        function getCurrentPlayingPath() {
            if (currentIndex >= 0 && allSongs[currentIndex]) {
                return allSongs[currentIndex].path;
            }
            return null;
        }

        // ==================== PLAYBACK ====================
        function playFromBrowse(path, url, title, artist) {
            let songIndex = allSongs.findIndex(s => s.path === path);
            if (songIndex === -1) {
                allSongs.push({ path, url, title, artist });
                songIndex = allSongs.length - 1;
            }
            
            currentIndex = songIndex;
            currentQueue = allSongs;
            currentQueueIndex = songIndex;

            audio.src = url;
            audio.load();
            audio.play().catch(e => console.error('Playback failed:', e));

            updateUI();
            updatePlayingHighlight();
        }

        function playSongAtQueueIndex(queueIndex) {
            if (queueIndex < 0 || queueIndex >= currentQueue.length) return;
            
            currentQueueIndex = queueIndex;
            const song = currentQueue[queueIndex];
            currentIndex = allSongs.findIndex(s => s.path === song.path);

            audio.src = song.url;
            audio.load();
            audio.play().catch(e => console.error('Playback failed:', e));

            updateUI();
            updatePlayingHighlight();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayButton();
        }

        function playPrev() {
            if (isShuffle) {
                playSongAtQueueIndex(Math.floor(Math.random() * currentQueue.length));
            } else if (currentQueueIndex > 0) {
                playSongAtQueueIndex(currentQueueIndex - 1);
            }
        }

        function playNext() {
            if (isShuffle) {
                playSongAtQueueIndex(Math.floor(Math.random() * currentQueue.length));
            } else if (currentQueueIndex < currentQueue.length - 1) {
                playSongAtQueueIndex(currentQueueIndex + 1);
            } else if (repeatMode === 1) {
                playSongAtQueueIndex(0);
            }
        }

        function updateUI() {
            if (currentQueueIndex >= 0 && currentQueue[currentQueueIndex]) {
                const song = currentQueue[currentQueueIndex];
                elements.miniTitle.textContent = song.title;
                elements.miniArtist.textContent = song.artist;
                elements.playPauseBtn.disabled = false;
                elements.prevBtn.disabled = currentQueueIndex === 0 && !isShuffle;
                elements.nextBtn.disabled = currentQueueIndex === currentQueue.length - 1 && !isShuffle;
                elements.prevBtn.style.opacity = (currentQueueIndex === 0 && !isShuffle) ? '0.54' : '1';
                elements.nextBtn.style.opacity = (currentQueueIndex === currentQueue.length - 1 && !isShuffle) ? '0.54' : '1';
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            elements.playIcon.classList.toggle('paused', audio.paused);
            elements.playPauseBtn.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
        }

        function updatePlayingHighlight() {
            const playingPath = getCurrentPlayingPath();
            document.querySelectorAll('.browse-item').forEach(item => {
                if (item.dataset.type === 'file') {
                    item.classList.toggle('playing', item.dataset.path === playingPath && !audio.paused);
                }
            });
        }

        // ==================== EVENT LISTENERS ====================
        elements.playPauseBtn.addEventListener('click', togglePlay);
        elements.prevBtn.addEventListener('click', playPrev);
        elements.nextBtn.addEventListener('click', playNext);

        elements.shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            elements.shuffleActive.classList.toggle('scale-0', !isShuffle);
            elements.shuffleActive.classList.toggle('opacity-0', !isShuffle);
        });

        elements.repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            elements.repeatActive.classList.toggle('scale-0', repeatMode === 0);
            elements.repeatActive.classList.toggle('opacity-0', repeatMode === 0);
        });

        elements.refreshBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loadSongs();
        });

        // Progress slider - WORKING
        elements.progressSlider.addEventListener('input', (e) => {
            const percent = e.target.value / 1000;
            updateProgressUI(percent);
            elements.currentTime.textContent = formatTime(percent * audio.duration);
        });

        elements.progressSlider.addEventListener('change', (e) => {
            const percent = e.target.value / 1000;
            audio.currentTime = percent * audio.duration;
        });

        // Click on progress track to seek
        document.getElementById('progressTrack')?.addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = e.target.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });

        // Volume slider - WORKING
        elements.volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value / 100;
            audio.volume = vol;
            updateVolumeUI(vol);
            updateVolumeIcon();
        });

        // Click on volume track
        document.getElementById('volumeTrack')?.addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.volume = percent;
            elements.volumeSlider.value = percent * 100;
            updateVolumeUI(percent);
            updateVolumeIcon();
        });

        elements.volumeBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            updateVolumeIcon();
            elements.volumeSlider.disabled = audio.muted;
            updateVolumeUI(audio.muted ? 0 : audio.volume);
        });

        // Audio events
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = audio.currentTime / audio.duration;
                updateProgressUI(percent);
                elements.currentTime.textContent = formatTime(audio.currentTime);
                elements.totalTime.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            elements.totalTime.textContent = formatTime(audio.duration);
            elements.progressSlider.disabled = false;
        });

        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        });

        audio.addEventListener('play', () => { updatePlayButton(); updatePlayingHighlight(); });
        audio.addEventListener('pause', () => { updatePlayButton(); updatePlayingHighlight(); });
        audio.addEventListener('error', (e) => {
            console.error('Audio error:', e);
            elements.miniTitle.textContent = 'Error loading track';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 10); break;
                case 'ArrowRight': e.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); break;
                case 'ArrowUp': e.preventDefault(); audio.volume = Math.min(1, audio.volume + 0.1); elements.volumeSlider.value = audio.volume * 100; elements.volumeSlider.dispatchEvent(new Event('input')); break;
                case 'ArrowDown': e.preventDefault(); audio.volume = Math.max(0, audio.volume - 0.1); elements.volumeSlider.value = audio.volume * 100; elements.volumeSlider.dispatchEvent(new Event('input')); break;
                case 'KeyM': audio.muted = !audio.muted; updateVolumeIcon(); elements.volumeSlider.disabled = audio.muted; updateVolumeUI(audio.muted ? 0 : audio.volume); break;
                case 'Backspace': 
                    if (currentBrowsePath) {
                        e.preventDefault();
                        const parentPath = getParentPath(currentBrowsePath);
                        renderBrowseView(parentPath);
                    }
                    break;
            }
        });

        // ==================== INITIALIZATION ====================
        async function loadSongs() {
            elements.loadingState.classList.remove('hidden');
            elements.trackList.classList.add('hidden');
            elements.emptyState.classList.add('hidden');
            
            try {
                allSongs = await fetchLocalSongs();
                
                if (allSongs.length === 0) {
                    elements.loadingState.classList.add('hidden');
                    elements.emptyState.classList.remove('hidden');
                    return;
                }
                
                // Build folder tree
                fileTree = buildFolderStructure(allSongs);
                
                // Start at root
                renderBrowseView('');
                
            } catch (e) {
                console.error('Failed to load songs:', e);
                elements.loadingState.classList.add('hidden');
                elements.emptyState.classList.remove('hidden');
            }
        }

        audio.volume = 0.7;
        updateVolumeUI(0.7);
        updateVolumeIcon();
        
        // Auto-load if configured, otherwise show empty state
        if (GITHUB_OWNER && GITHUB_REPO) {
            loadSongs();
        } else {
            elements.loadingState.classList.add('hidden');
            elements.emptyState.classList.remove('hidden');
            elements.emptyState.querySelector('p').innerHTML = 'Configure your GitHub repo to load songs from <code>songs/</code> folder.<br>Click the <button class="interactable flex size-10 items-center justify-center rounded-full" style="margin-left: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><use href="#system-icon-settings"></use></svg></button> button.';
        }
    </script>
</body>
</html>
